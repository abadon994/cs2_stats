<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CS2 Stats{% endblock %}</title>
    
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Кастомная тема -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=99">
</head>
<body>

<!-- Навигация -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-crosshair text-warning"></i> CS2 Stats
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/"><i class="bi bi-house"></i> Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/stats"><i class="bi bi-graph-up"></i> Статистика</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning fw-bold" href="/add"><i class="bi bi-plus-circle-fill"></i> Добавить матч</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Основной контент -->
<main class="container my-4 flex-grow-1">
    {% block content %}{% endblock %}
</main>

<!-- Футер -->
<footer class="text-center py-3 mt-auto">
    <div class="container">
        <p class="mb-0 text-muted">© 2026 CS2 Stats Tracker | Flask & Bootstrap</p>
    </div>
</footer>

<!-- Bootstrap 5.3.3 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
